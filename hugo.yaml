title: "Collab.codes Docs"
baseURL: "https://docs.collab.codes"

module:
  imports:
    - path: github.com/imfing/hextra

ignoreLogs:
  - "deprecated"

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: content/en
    params:
      description: "Official documentation and knowledge base of Collab.codes"
    menu:
      main:
        - name: Home
          url: "https://www.collab.codes"
          weight: 1
        - name: Docs
          url: /docs/
          weight: 2
        - name: Blog
          url: "https://blog.collab.codes"
          weight: 3
        - name: Search
          weight: 4
          params:
            type: search
        - name: GitHub
          weight: 5
          url: "https://github.com/collab-codes/collab-docs-hextra"
          params:
            icon: github
  pt:
    languageName: "Português"
    weight: 2
    contentDir: content/pt
    params:
      description: "Documentação oficial e base de conhecimento da Collab.codes"
    menu:
      main:
        - name: Início
          url: "https://www.collab.codes"
          weight: 1
        - name: Docs
          url: /pt/docs/
          weight: 2
        - name: Blog
          url: "https://blog.collab.codes/pt/"
          weight: 3
        - name: Busca
          weight: 4
          params:
            type: search
        - name: GitHub
          weight: 5
          url: "https://github.com/collab-codes/collab-docs-hextra"
          params:
            icon: github

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  theme:
    default: system
    displayToggle: true

  showSearch: true
  showToc: true
  showLastUpdated: true
  showBreadCrumbs: true

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/collab-codes/collab-docs-hextra/edit/main/content"
